[project]
name = "auto-research"
version = "0.1.0"
description = "Autonomous AI research agent: literature → design → GPU experiments on RunPod → report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "asyncssh>=2.18.0",
    "pyyaml>=6.0",
    "typer>=0.12.5",
    "arxiv>=2.1.3",
    "semanticscholar>=0.8.4",
    "datasets>=3.0.0",
    "rapidfuzz>=3.10.0",
]

[project.scripts]
research = "auto_research.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "runpod_live: requires real RunPod API access; skipped by default",
]
addopts = "-m 'not runpod_live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
