id: smoke
title: "Smoke test — tiny embedding benchmark"
problem_statement: |
  Compare two small sentence-embedding models (BAAI/bge-small-en-v1.5 and
  sentence-transformers/all-MiniLM-L6-v2) on a 100-row subset of the STS-B
  benchmark. Report Spearman correlation. This is a smoke test for the
  end-to-end pipeline, not a serious research question.

domains: ["semantic-textual-similarity"]
success_criteria:
  - "Both models produce valid Spearman scores on the held-out subset."
  - "Report includes at least 3 real citations (foundation papers for both models + STS-B)."

compute_hint:
  gpu: "NVIDIA RTX A5000"
  num_pods: 1
  estimated_minutes: 5
